name: "Git Survival Monitor"

on:
  schedule:
    - cron: '0 8 * * 1' # Runs every Monday at 8:00 AM UTC
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # VERY IMPORTANT: fetch the entire git history, not just the latest commit!
          
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        
      - name: Install dependencies
        run: uv sync
          
      - name: Run Git Survival Analysis
        env:
          PYTHONPATH: src
        run: |
          uv run python -m cli . --output survival_report.html
          
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: survival-report
          path: survival_report.html
