[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-survival"
version = "1.2.0"
description = "Survival Analysis for Git Contributor Churn"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Maxime", email = "maxime2476@example.com" }
]
dependencies = [
    "pydriller>=2.6.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "lifelines>=0.30.0",
    "typer[all]>=0.12.0",
    "click<8.1.8",
    "rich>=13.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "jinja2>=3.1.0",
    "textblob>=0.17.1",
    "tabulate>=0.9.0",
    "streamlit>=1.28.0"
]

[project.scripts]
git-survival = "cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.5.0"
]
